[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halftone-playground"
version = "0.0.1"
description = "Experiments in variable-width line halftoning (stripe and spiral modes)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pillow",
    "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
halftone-playground = "halftone_playground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The GUI *shell* tests drive a real Tk widget tree, so they are opt-in: they
# need a display (or Xvfb) and they pull ``tkinter`` into ``sys.modules``,
# which the headless smoke guard (``test_no_gui_toolkits_loaded``) rightly
# forbids in the default run.  The toolkit-free GUI *logic* tests
# (params / state / imageutil) are normal tests and always run.
addopts = "-m 'not gui'"
markers = [
    "gui: GUI shell tests that require a real Tk display or Xvfb (opt-in via -m gui)",
]
